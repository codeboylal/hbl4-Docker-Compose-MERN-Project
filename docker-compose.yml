services:
  react-app:
    build:
      context: ./client
      dockerfile: Dockerfile
      args:
        # Relative path => browser calls the same domain => no CORS.
        REACT_APP_API_URL: /api
    restart: unless-stopped
    # Only the host nginx may reach it. NOT exposed to the internet.
    ports:
      - "127.0.0.1:8080:80"
    networks:
      - mern-app
    depends_on:
      - api-server

  api-server:
    build:
      context: ./server
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      PORT: 5000
      MONGO_URI: mongodb://mongo:27017/cinema
    # Only the host nginx may reach it. NOT exposed to the internet.
    ports:
      - "127.0.0.1:5000:5000"
    networks:
      - mern-app
    depends_on:
      - mongo

  mongo:
    image: mongo:4.4
    restart: unless-stopped
    # NO ports: section on purpose. Mongo has no auth enabled, so it must stay
    # reachable only from inside the mern-app network (api-server talks to it
    # as mongodb://mongo:27017). Publishing 27017 would expose the database
    # to the whole internet.
    networks:
      - mern-app
    volumes:
      - mongo-data:/data/db

networks:
  mern-app:
    driver: bridge

volumes:
  mongo-data:
    driver: local
